<!DOCTYPE html>
<html>
<head>
    <title>AI Ad Console</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-4">
    <div class="max-w-7xl mx-auto">
        <header class="mb-4 border-b border-slate-800 pb-2 flex justify-between">
            <h1 class="text-xl font-bold text-blue-400">Smart Bidding Console (INR)</h1>
            <div class="flex items-center gap-2"><div class="status-indicator status-online"></div><span class="text-xs text-green-500 font-mono">AGENT_LIVE</span></div>
        </header>

        <div class="grid grid-cols-4 gap-4 mb-4 text-center">
            <div class="bg-slate-800 p-4 rounded border-b-2 border-blue-500"><span class="text-xs text-slate-400 block">CLICKS</span><span id="clicks" class="text-xl font-bold">0</span></div>
            <div class="bg-slate-800 p-4 rounded border-b-2 border-green-500"><span class="text-xs text-slate-400 block">SPEND</span><span id="spend" class="text-xl font-bold">₹0</span></div>
            <div class="bg-slate-800 p-4 rounded border-b-2 border-purple-500"><span class="text-xs text-slate-400 block">CTR</span><span id="ctr" class="text-xl font-bold">0%</span></div>
            <div class="bg-slate-800 p-4 rounded border-b-2 border-yellow-500"><span class="text-xs text-slate-400 block">EPSILON</span><span id="epsilon" class="text-xl font-bold">1.0</span></div>
        </div>

        <div class="grid grid-cols-12 gap-4">
            <div class="col-span-3 bg-slate-800 rounded-lg p-4">
                <img src="https://images.unsplash.com/photo-1696446701796-da61225697cc?w=400" class="rounded mb-4">
                <h2 class="font-bold">iPhone 15 Pro Max</h2>
                <div class="my-4">
                    <div class="flex justify-between text-[10px] mb-1"><span>Intent</span><span id="intentText">0%</span></div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden"><div id="intentBar" class="bg-blue-500 h-full w-0 transition-all"></div></div>
                </div>
                <div class="space-y-2">
                    <button id="startBtn" class="w-full bg-blue-600 py-2 rounded font-bold">Start Training</button>
                    <div class="flex gap-2"><button id="saveBtn" class="flex-1 bg-slate-700 text-xs py-1 rounded">Save</button><button id="loadBtn" class="flex-1 bg-slate-700 text-xs py-1 rounded">Load</button></div>
                    <button id="pdfBtn" class="w-full bg-amber-600 py-2 rounded font-bold text-sm">Download Report</button>
                </div>
            </div>

            <div class="col-span-6 bg-slate-800 p-4 rounded-lg flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase">Reward History (Scroll Right &rarr;)</h3>
                <div id="graphWrapper" class="flex-grow overflow-x-auto border border-slate-700 rounded bg-slate-900">
                    <div id="graphContainer" style="width: 2000px; height: 100%;"><canvas id="mainChart"></canvas></div>
                </div>
            </div>

            <div class="col-span-3 bg-slate-900 p-3 rounded-lg border border-slate-800 flex flex-col h-96">
                <h3 class="text-xs font-bold text-slate-500 mb-2 uppercase">Infinite Live Log</h3>
                <div id="logBox" class="flex-grow overflow-y-auto space-y-1"></div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
